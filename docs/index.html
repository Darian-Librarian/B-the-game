<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>B</title>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <button id="theme-toggle" onclick="cycleTheme()">Theme: Dark</button>

  <div id="app">Loading B...</div>

  <script>
    window.$docsify = {
      name: 'B',
      repo: 'b-universe/B-the-game',
      logo: './assets/b_logo.png',
      loadSidebar: true,
      maxLevel: 0,
      subMaxLevel: 0,
      auto2top: true,
      notFoundPage: true,

      plugins: [
        function (hook, vm) {
          hook.doneEach(function () {
            const sidebar = document.querySelector('.sidebar');
            const btn = document.getElementById('theme-toggle');

            if (sidebar && btn && !sidebar.contains(btn)) {
              sidebar.appendChild(btn);
            }

            // --- dynamic subtitles ---
            const stubTitle = document.getElementById('stub-title');
            if (stubTitle) {
              const pathParts = window.location.hash.split('/');
              const rawName = pathParts.filter(p => p && p !== '#' && p !== '_404').pop() || 'New page';
              const cleanName = rawName.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
              stubTitle.innerText = cleanName;
            }

            if (window.initWikiTooltips) window.initWikiTooltips();
          });
        }
      ]
    };
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://unpkg.com/@popperjs/core@2"></script>
  <script src="https://unpkg.com/tippy.js@6"></script>
  <script src="glossary.js"></script>
  <script>
    const themes = ['dark', 'dim', 'ecstatic'];
    function applyTheme(name) {
      document.body.classList.remove('dim', 'ecstatic');
      if (name !== 'dark') document.body.classList.add(name);
      document.getElementById('theme-toggle').innerText = `Theme: ${name.charAt(0).toUpperCase() + name.slice(1)}`;
      localStorage.setItem('b-wiki-theme', name);
    }
    function cycleTheme() {
      let idx = (themes.indexOf(localStorage.getItem('b-wiki-theme') || 'dark') + 1) % themes.length;
      applyTheme(themes[idx]);
    }
    applyTheme(localStorage.getItem('b-wiki-theme') || 'dark');
  </script>
</body>
</html>
